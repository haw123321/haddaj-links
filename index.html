<title>هدّاج — Haddaj | حمّل التطبيق</title>
<meta name="description" content="هدّاج — اكتشف العروض والأسر المنتجة وعربات الطعام والفعاليات حولك على الخريطة. حمّل التطبيق الآن.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:   #2B7DE9;
    --orange: #F5820B;
    --green:  #1FA35C;
    --purple: #8B5CF6;
    --brown:  #8B5E3C;
    --ink:    #1C2430;
    --muted:  #5B6674;
    --paper:  #F1F3EF;
    --card:   #FFFFFF;
    --line:   #E3E7E0;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'IBM Plex Sans Arabic',sans-serif;
    color:var(--ink);
    background-color:var(--paper);
    /* شبكة شوارع خفيفة مستوحاة من الخريطة */
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:44px 44px;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 16px;
  }
  .card{
    width:100%;
    max-width:420px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:24px;
    padding:40px 28px 32px;
    text-align:center;
    box-shadow:0 12px 40px rgba(28,36,48,.08);
  }
  /* شعار الدبوس */
  .logo{
    height:84px;margin:0 auto 16px;
    display:flex;align-items:center;justify-content:center;
  }
  .logo img{height:100%;width:auto}
  h1{
    font-family:'Baloo Bhaijaan 2',sans-serif;
    font-weight:800;
    font-size:2.4rem;
    line-height:1.1;
  }
  .en-name{
    font-family:'Baloo Bhaijaan 2',sans-serif;
    font-weight:700;
    font-size:1.05rem;
    color:var(--muted);
    letter-spacing:.14em;
    margin-top:2px;
  }
  .tagline{
    color:var(--muted);
    font-size:.95rem;
    line-height:1.7;
    margin:14px auto 26px;
    max-width:300px;
  }
  /* صف الدبابيس الخمسة */
  .pins{
    display:flex;
    justify-content:center;
    gap:14px;
    margin-bottom:28px;
  }
  .pin{
    width:14px;height:14px;
    border-radius:50% 50% 50% 0;
    transform:rotate(-45deg);
    animation:drop .5s cubic-bezier(.2,.9,.3,1.4) backwards;
  }
  .pin:nth-child(1){background:var(--blue);   animation-delay:.05s}
  .pin:nth-child(2){background:var(--orange); animation-delay:.15s}
  .pin:nth-child(3){background:var(--green);  animation-delay:.25s}
  .pin:nth-child(4){background:var(--purple); animation-delay:.35s}
  .pin:nth-child(5){background:var(--brown);  animation-delay:.45s}
  @keyframes drop{
    from{opacity:0;transform:rotate(-45deg) translate(14px,-14px)}
    to{opacity:1;transform:rotate(-45deg) translate(0,0)}
  }
  @media (prefers-reduced-motion: reduce){
    .pin{animation:none}
  }
  /* الأزرار */
  .links{display:flex;flex-direction:column;gap:12px}
  .btn{
    display:flex;
    align-items:center;
    gap:14px;
    padding:15px 18px;
    border:1px solid var(--line);
    border-radius:14px;
    background:var(--card);
    text-decoration:none;
    color:var(--ink);
    transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  }
  .btn:hover,.btn:focus-visible{
    transform:translateY(-2px);
    box-shadow:0 6px 18px rgba(28,36,48,.10);
    outline:none;
  }
  .btn:focus-visible{border-color:var(--ink)}
  .btn .icon{
    width:40px;height:40px;flex:0 0 40px;
    border-radius:11px;
    display:flex;align-items:center;justify-content:center;
  }
  .btn .icon svg{width:22px;height:22px;fill:#fff}
  .btn.apple  .icon{background:var(--ink)}
  .btn.google .icon{background:var(--blue)}
  .btn.tiktok .icon{background:#010101}
  .btn.wa     .icon{background:var(--green)}
  .btn.mail   .icon{background:var(--purple)}
  .btn .txt{text-align:right;line-height:1.35}
  .btn .txt b{display:block;font-size:1rem;font-weight:600}
  .btn .txt span{font-size:.8rem;color:var(--muted)}
  footer{
    margin-top:26px;
    font-size:.78rem;
    color:var(--muted);
  }
</style>
